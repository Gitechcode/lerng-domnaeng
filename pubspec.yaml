name: lerng_domnaeng
description: "ឡើងដំណែង — Lerng Domnaeng (Khmer-first career development mobile platform)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture, State & Routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Firebase Core & Backend
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_storage: ^12.4.4
  firebase_messaging: ^15.2.4
  cloud_functions: ^5.2.3

  # Typography & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17

  # Media & Utilities
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  http: ^1.2.2
  web: ^1.1.1
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
